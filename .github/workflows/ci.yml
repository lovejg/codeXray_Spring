name: CI / CD

# 언제 돌릴지: master 로 push 되거나, master 를 향한 PR 이 생길 때.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# 이미지를 GHCR(GitHub 이미지 창고)에 올리려면 packages 쓰기 권한이 필요.
permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Backend build & test
    runs-on: ubuntu-latest

    # 테스트가 앱 전체를 부팅(contextLoads)하므로 진짜 Postgres 가 필요.
    # GitHub 이 임시 컨테이너로 띄워주고, job 에서는 localhost:5432 로 접속 가능.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codexray
          POSTGRES_USER: codexray
          POSTGRES_PASSWORD: codexray
        ports:
          - 5432:5432
        # DB 가 "준비됨" 상태가 될 때까지 기다렸다가 테스트 시작.
        options: >-
          --health-cmd "pg_isready -U codexray"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1) 저장소 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v5

      # 2) JDK 21 설치 (+ Gradle 캐시로 다음 실행 빠르게)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 3) gradlew 실행권한 부여 (윈도우에서 커밋되면 실행비트가 빠질 수 있음)
      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      # 4) 테스트 실행. 앱 부팅에 필요한 값들을 더미로 주입.
      #    (실제 배포값이 아니라 CI 전용 가짜값 — 여기선 아무거나 형식만 맞으면 됨)
      - name: Run tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/codexray
          DB_USERNAME: codexray
          DB_PASSWORD: codexray
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          # JWT_SECRET 은 HMAC-SHA 키라서 최소 32바이트(=32글자) 이상이어야 함.
          JWT_SECRET: ci-dummy-secret-key-please-change-0123456789
          JWT_ACCESS_EXPIRATION_MS: 1800000
          REFRESH_EXPIRATION_DAYS: 14
          COOKIE_SECURE: false
          MAIL_MODE: console
          MAIL_FROM: noreply@codexray.local
          APP_BASE_URL: http://localhost:8080
          ADMIN_EMAIL: admin@codexray.local
          ADMIN_API_KEY: ci-dummy-admin-key
        run: ./gradlew test --no-daemon

  # ── 이미지 빌드 & GHCR 업로드 ──
  # 테스트(backend-test)가 통과해야만 실행되고, master 로 "push" 될 때만 실행.
  # (PR 때는 테스트만 돌고 이미지는 안 올림)
  build-and-push:
    name: Build & push images
    needs: backend-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # GHCR 이미지 이름은 소문자만 허용. 소유자명(대문자 가능)을 소문자로 변환.
      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # GHCR 로그인 — GitHub 이 자동으로 주는 토큰 사용(따로 비번 설정 불필요).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 백엔드 이미지: latest + 커밋 sha 두 태그로 올림.
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/codexray-backend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/codexray-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 프론트 이미지: 빌드 시 환경변수 불필요(API 는 same-origin /api).
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/codexray-frontend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/codexray-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# codexray 입구(frontend 컨테이너)의 nginx 설정: 프론트 정적파일 서빙 + /api 를 backend 컨테이너로 프록시.
# 운영에서는 이 앞에 서버의 바깥 Nginx(/srv/edge)가 있다. HTTPS 는 바깥 Nginx 가 풀고 여기로는 평문 HTTP 로 온다.
server {
    listen 80;
    server_name _;   # 호스트(도메인) 구분은 바깥 Nginx 가 한다

    # 빌드된 React 정적파일 위치 (아래 Dockerfile 에서 여기로 복사함)
    root /usr/share/nginx/html;
    index index.html;

    # ── 1) API: /api/* 는 backend 컨테이너로 넘김 ──
    # 'backend' = 같은 docker 네트워크의 compose 서비스명.
    # location 을 / 보다 먼저 둬서 /api 요청이 먼저 매칭되게 함.
    location /api/ {
        # 도커 내부 DNS. 업스트림을 '변수'로 두면 nginx 가 시작 시점이 아니라
        # 요청마다 이름을 재해석 → backend 가 늦게 떠도, 다시 만들어져 IP 가 바뀌어도 nginx 는 정상.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream$request_uri;   # /api 경로 그대로 전달

        proxy_set_header Host $host;
        # 바깥 Nginx 가 붙인 사용자 IP 뒤에 바깥 Nginx 의 IP 를 덧붙인다
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 여기의 $scheme 은 늘 http 다. 바깥 Nginx 가 알려 준 원래 프로토콜(https)을 그대로 넘긴다
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── 2) vite 가 만든 파일: 이름에 내용 해시가 붙어 내용이 바뀌면 이름도 바뀐다 → 오래 캐시해도 된다 ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 3) 그 외 전부: 정적파일, 없으면 index.html (SPA 라우팅) ──
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 은 캐시하지 않는다. 새 버전을 올리면 바로 새 파일 이름을 가리켜야 한다
        add_header Cache-Control "no-cache";
    }
}

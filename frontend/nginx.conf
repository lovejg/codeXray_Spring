# codexray 입구(frontend 컨테이너)의 nginx 설정: 프론트 정적파일 서빙 + /api 를 backend 컨테이너로 프록시.
# 운영에서는 이 앞에 서버의 바깥 Nginx(/srv/edge)가 있다. HTTPS 는 바깥 Nginx 가 풀고 여기로는 평문 HTTP 로 온다.
server {
    listen 80;
    server_name _;   # 호스트(도메인) 구분은 바깥 Nginx 가 한다

    # 빌드된 React 정적파일 위치 (아래 Dockerfile 에서 여기로 복사함)
    root /usr/share/nginx/html;
    index index.html;

    # 글자로 된 응답은 gzip 으로 줄여 보낸다. 켜기 전에는 1.7MB JS 를 그대로 보내 느린 4G 에서 첫 화면이 10초 걸렸다.
    # 바깥 Nginx 는 받은 그대로 넘기므로 여기서 한 번만 한다. text/html 은 기본으로 들어간다
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # 바깥 Nginx 는 여기로 HTTP/1.0 으로 넘긴다(proxy_http_version 기본값). gzip 은 기본으로 1.1 요청에만 압축해서,
    # 이 줄이 없으면 운영에서는 Vary 만 붙고 압축이 안 된다. 브라우저가 직접 붙는 로컬에서는 드러나지 않았다
    gzip_http_version 1.0;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 보안 헤더. always: 오류 응답(4xx/5xx)에도 붙인다.
    # nginx 의 add_header 는 location 안에 add_header 가 하나라도 있으면 여기 것을 물려받지 않는다. 그래서 아래 location 마다 다시 적는다
    #  - nosniff: 브라우저가 Content-Type 을 추측해 JS 로 실행하지 않게
    #  - frame-ancestors 'none' / DENY: 다른 사이트가 이 화면을 iframe 에 넣어 클릭을 가로채지 못하게(클릭재킹)
    #  - Referrer-Policy: 다른 사이트로 나갈 때 주소의 경로·쿼리(인증 토큰 등)를 넘기지 않게
    #  - HSTS: 한 번 HTTPS 로 들어온 브라우저는 1년 동안 http 로 붙지 않게. HTTPS 는 바깥 Nginx 가 풀지만 헤더는 여기서 붙여도 그대로 전달된다
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── 1) API: /api/* 는 backend 컨테이너로 넘김 ──
    # 'backend' = 같은 docker 네트워크의 compose 서비스명.
    # location 을 / 보다 먼저 둬서 /api 요청이 먼저 매칭되게 함.
    location /api/ {
        # 도커 내부 DNS. 업스트림을 '변수'로 두면 nginx 가 시작 시점이 아니라
        # 요청마다 이름을 재해석 → backend 가 늦게 떠도, 다시 만들어져 IP 가 바뀌어도 nginx 는 정상.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream$request_uri;   # /api 경로 그대로 전달

        proxy_set_header Host $host;
        # 바깥 Nginx 가 붙인 사용자 IP 뒤에 바깥 Nginx 의 IP 를 덧붙인다
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 여기의 $scheme 은 늘 http 다. 바깥 Nginx 가 알려 준 원래 프로토콜(https)을 그대로 넘긴다
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── 2) vite 가 만든 파일: 이름에 내용 해시가 붙어 내용이 바뀌면 이름도 바뀐다 → 오래 캐시해도 된다 ──
    # expires 와 add_header 를 같이 쓰면 Cache-Control 줄이 두 개 나간다. 한 줄로 쓴다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ── 3) 그 외 전부: 정적파일, 없으면 index.html (SPA 라우팅) ──
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 은 캐시하지 않는다. 새 버전을 올리면 바로 새 파일 이름을 가리켜야 한다
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}

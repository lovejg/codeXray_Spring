# Main EC2 의 nginx 설정: 프론트 정적파일 서빙 + /api 를 backend 컨테이너로 프록시.
server {
    listen 80;
    server_name _;   # 아무 호스트명이나 받음 (지금은 IP 접속)

    # 빌드된 React 정적파일 위치 (아래 Dockerfile 에서 여기로 복사함)
    root /usr/share/nginx/html;
    index index.html;

    # ── 1) API: /api/* 는 backend 컨테이너로 넘김 ──
    # 'backend' = 같은 docker 네트워크의 컨테이너 이름 (compose 서비스명).
    # location 을 / 보다 먼저 둬서 /api 요청이 먼저 매칭되게 함.
    location /api/ {
        # 도커 내부 DNS. 업스트림을 '변수'로 두면 nginx 가 시작 시점이 아니라
        # 요청마다 이름을 재해석 → backend 가 늦게 떠도 nginx 는 먼저 정상 기동.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream$request_uri;   # /api 경로 그대로 전달

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # http/https 여부 전달 (나중 HTTPS 대비)
    }

    # ── 2) 그 외 전부: 정적파일, 없으면 index.html (SPA 라우팅) ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}

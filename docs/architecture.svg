<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .t  { fill:#e2e8f0; font-size:17px; font-weight:700 }
      .s  { fill:#94a3b8; font-size:13px }
      .xs { fill:#94a3b8; font-size:12px }
      .h  { fill:#cbd5e1; font-size:14px; font-weight:700; letter-spacing:.5px }
      .lbl{ fill:#cbd5e1; font-size:12.5px }
      .tl { fill:#5eead4; font-size:12.5px; font-weight:600 }
      .vl { fill:#c4b5fd; font-size:12.5px; font-weight:600 }
      .box   { fill:#111827; stroke:#334155; stroke-width:1.5; rx:12 }
      .boxT  { fill:#0f1f24; stroke:#2dd4bf; stroke-width:1.6; rx:12 }
      .boxV  { fill:#1a1530; stroke:#a78bfa; stroke-width:1.6; rx:12 }
      .store { fill:#131b2e; stroke:#60a5fa; stroke-width:1.6; rx:12 }
      .ext   { fill:#1c1917; stroke:#f59e0b; stroke-width:1.5; rx:12; stroke-dasharray:6 4 }
      .zone  { fill:none; stroke:#475569; stroke-width:1.5; rx:18; stroke-dasharray:7 5 }
      .zoneS { fill:#0b1220; stroke:#334155; stroke-width:1.5; rx:18 }
      .ln  { stroke:#94a3b8; stroke-width:1.8; fill:none }
      .lnT { stroke:#2dd4bf; stroke-width:2; fill:none }
      .lnV { stroke:#a78bfa; stroke-width:2; fill:none; stroke-dasharray:6 4 }
      .num { fill:#a78bfa; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#0a0f1a"/>
  <text x="40" y="52" fill="#f8fafc" font-size="28" font-weight="800">codeXray 시스템 아키텍처</text>
  <text x="40" y="80" class="s">오라클 클라우드 Arm 서버 한 대 · Docker Compose · same-origin(/api 프록시) · AI 는 Kafka 비동기 · master 머지 → 테스트 → 배포 자동</text>

  <!-- ── 클라이언트 ── -->
  <text x="40" y="130" class="h">CLIENTS</text>
  <rect class="box" x="40" y="145" width="250" height="92"/>
  <text x="62" y="178" class="t">웹 브라우저</text>
  <text x="62" y="202" class="s">React 19 · Vite · TanStack Query</text>
  <text x="62" y="222" class="xs">refresh = httpOnly 쿠키</text>

  <rect class="box" x="40" y="257" width="250" height="92"/>
  <text x="62" y="290" class="t">브라우저 확장</text>
  <text x="62" y="314" class="s">프로그래머스 → 풀이 저장</text>
  <text x="62" y="334" class="xs">refresh = X-Refresh-Token 헤더</text>

  <!-- ── 서버 영역 ── -->
  <rect class="zoneS" x="360" y="110" width="1200" height="560"/>
  <text x="384" y="140" class="h">ORACLE CLOUD · AMPERE A1 (ARM) · 서버 한 대</text>
  <text x="1536" y="140" class="xs" text-anchor="end">밖으로 여는 포트: 80, 443 뿐</text>

  <!-- 바깥 Nginx -->
  <rect class="box" x="384" y="165" width="200" height="150"/>
  <text x="404" y="198" class="t">바깥 Nginx</text>
  <text x="404" y="222" class="s">HTTPS 종료</text>
  <text x="404" y="242" class="s">Let's Encrypt</text>
  <text x="404" y="262" class="s">도메인별 앱 입구</text>
  <text x="404" y="292" class="xs">다른 앱(Bandal)과 공유</text>

  <!-- codexray compose 묶음 -->
  <rect class="zone" x="620" y="160" width="916" height="490"/>
  <text x="642" y="188" class="h">codexray 묶음 · Docker Compose</text>
  <text x="1514" y="188" class="xs" text-anchor="end">컨테이너마다 mem_limit · DB/Redis/Kafka 는 ports 없음</text>

  <rect class="boxT" x="642" y="205" width="240" height="150"/>
  <text x="662" y="238" class="t">frontend · nginx</text>
  <text x="662" y="262" class="s">정적 파일 + /api 프록시</text>
  <text x="662" y="282" class="s">gzip(HTTP/1.0 포함)</text>
  <text x="662" y="302" class="s">React.lazy 화면 나누기</text>
  <text x="662" y="322" class="s">보안 헤더(HSTS·nosniff …)</text>
  <text x="662" y="342" class="xs">edge 네트워크에 붙는 유일한 컨테이너</text>

  <rect class="boxT" x="930" y="205" width="300" height="250"/>
  <text x="950" y="238" class="t">backend · Spring Boot 4</text>
  <text x="950" y="262" class="s">Java 21 · Spring Security + JWT</text>
  <text x="950" y="284" class="s">REST 엔드포인트 60개</text>
  <text x="950" y="306" class="s">JPA + QueryDSL · @BatchSize</text>
  <text x="950" y="328" class="s">@Cacheable(sync) · 목록/상세/태그</text>
  <text x="950" y="350" class="s">로그인 시도 제한 · AI 하루 한도</text>
  <text x="950" y="372" class="s">Kafka producer / consumer</text>
  <text x="950" y="394" class="s">@PreAuthorize(관리자 이중 방어)</text>
  <text x="950" y="430" class="xs">mem 768m · JVM 힙 75% · /actuator(내부)</text>

  <!-- 저장소들 -->
  <rect class="store" x="642" y="480" width="270" height="150"/>
  <text x="662" y="512" class="t">PostgreSQL 17</text>
  <text x="662" y="536" class="s">Flyway V1~V11 이 스키마 소유</text>
  <text x="662" y="556" class="s">Hibernate 는 validate 만</text>
  <text x="662" y="576" class="s">탈퇴 정리 = FK CASCADE</text>
  <text x="662" y="606" class="xs">문제 689 · 태그 25 (시드)</text>

  <rect class="store" x="930" y="480" width="300" height="150"/>
  <text x="950" y="512" class="t">Redis 7</text>
  <text x="950" y="536" class="s">refresh 토큰 + 사용자별 Set(일괄 만료)</text>
  <text x="950" y="556" class="s">회전 = GETDEL 한 번(원자적)</text>
  <text x="950" y="576" class="s">조회 캐시 · 로그인 실패 · AI 한도</text>
  <text x="950" y="606" class="xs">maxmemory 정책 없음(토큰 보호)</text>

  <rect class="boxV" x="1260" y="205" width="256" height="250"/>
  <text x="1280" y="238" class="t">Kafka 3.9 (KRaft)</text>
  <text x="1280" y="262" class="s">토픽 ai-jobs</text>
  <text x="1280" y="282" class="s">실패 2회 재시도 → ai-jobs.DLT</text>
  <text x="1280" y="312" class="vl">AI 잡 상태</text>
  <text x="1280" y="334" class="s">PENDING → PROCESSING</text>
  <text x="1280" y="354" class="s">→ DONE / FAILED</text>
  <text x="1280" y="376" class="xs">조건부 UPDATE 로 한 번만 처리</text>
  <text x="1280" y="396" class="xs">15분 멈춘 잡은 자동 FAILED</text>
  <text x="1280" y="430" class="xs">heap 512m</text>

  <rect class="box" x="1260" y="480" width="256" height="150"/>
  <text x="1280" y="512" class="t">백업</text>
  <text x="1280" y="536" class="s">pg_dump → 빈 DB 에 복구해</text>
  <text x="1280" y="556" class="s">행 수 비교 → R2 업로드</text>
  <text x="1280" y="576" class="s">매일 새벽 + 배포 직전</text>
  <text x="1280" y="606" class="xs">끊기면 healthchecks.io 메일</text>

  <!-- 외부 -->
  <rect class="ext" x="1260" y="700" width="300" height="86"/>
  <text x="1280" y="733" class="t">Anthropic Claude API</text>
  <text x="1280" y="757" class="s">claude-opus-5-5 · effort medium</text>
  <text x="1280" y="776" class="xs">사용자 코드는 &lt;user_code&gt; 안의 데이터로만</text>

  <rect class="ext" x="930" y="700" width="300" height="86"/>
  <text x="950" y="733" class="t">Cloudflare R2</text>
  <text x="950" y="757" class="s">DB 백업 보관</text>

  <!-- ── 요청 흐름 화살표 ── -->
  <path class="ln" d="M290 191 H330 V240 H384" marker-end="url(#arr)"/>
  <path class="ln" d="M290 303 H330 V240" />
  <text x="338" y="232" class="lbl">HTTPS</text>
  <path class="ln" d="M584 240 H642" marker-end="url(#arr)"/>
  <path class="lnT" d="M882 280 H930" marker-end="url(#arrT)"/>
  <text x="886" y="272" class="tl">/api</text>
  <path class="ln" d="M1000 455 V480" marker-end="url(#arr)"/>
  <path class="ln" d="M960 455 V468 H777 V480" marker-end="url(#arr)"/>
  <path class="ln" d="M1290 630 V665 H1080 V700" marker-end="url(#arr)"/>

  <!-- AI 비동기 흐름 -->
  <path class="lnV" d="M1230 250 H1260" marker-end="url(#arrV)"/>
  <circle cx="1245" cy="236" r="9" class="num"/><text x="1245" y="240.5" fill="#0a0f1a" font-size="11" font-weight="800" text-anchor="middle">1</text>
  <path class="lnV" d="M1260 330 H1230" marker-end="url(#arrV)"/>
  <circle cx="1245" cy="316" r="9" class="num"/><text x="1245" y="320.5" fill="#0a0f1a" font-size="11" font-weight="800" text-anchor="middle">2</text>
  <path class="lnV" d="M1215 455 V468 H1245 V690 H1300 V700" marker-end="url(#arrV)"/>
  <circle cx="1245" cy="560" r="9" class="num"/><text x="1245" y="564.5" fill="#0a0f1a" font-size="11" font-weight="800" text-anchor="middle">3</text>

  <!-- AI 흐름 범례 -->
  <rect x="40" y="420" width="290" height="230" rx="14" fill="#140f24" stroke="#4c1d95"/>
  <text x="60" y="450" class="vl" font-size="14">AI 분석 · 힌트 (비동기)</text>
  <text x="60" y="478" class="lbl"><tspan class="vl">1</tspan>  요청 → 잡을 PENDING 으로 저장(커밋)</text>
  <text x="60" y="498" class="lbl">    → ai-jobs 에 발행 → jobId 즉시 응답</text>
  <text x="60" y="524" class="lbl"><tspan class="vl">2</tspan>  컨슈머가 PENDING→PROCESSING 으로</text>
  <text x="60" y="544" class="lbl">    가져간 쪽만 처리(중복 호출 방지)</text>
  <text x="60" y="570" class="lbl"><tspan class="vl">3</tspan>  Claude 호출(트랜잭션 밖) → DONE</text>
  <text x="60" y="596" class="lbl"><tspan class="vl">4</tspan>  화면은 GET /api/ai/jobs/{id} 폴링</text>
  <text x="60" y="626" class="xs">발행 실패 → 즉시 FAILED + 한도 1회 환불</text>

  <!-- ── CI/CD ── -->
  <rect class="zoneS" x="40" y="830" width="1520" height="120"/>
  <text x="64" y="860" class="h">CI / CD · master 머지 한 번이면</text>
  <g font-size="13.5">
    <rect class="box" x="64" y="876" width="200" height="54"/>
    <text x="84" y="900" class="t" font-size="15">GitHub</text><text x="84" y="920" class="xs">PR → master</text>
    <rect class="box" x="310" y="876" width="310" height="54"/>
    <text x="330" y="900" class="t" font-size="15">Actions · 테스트</text><text x="330" y="920" class="xs">gradle test(Postgres·Redis 서비스) · lint · build</text>
    <rect class="box" x="666" y="876" width="300" height="54"/>
    <text x="686" y="900" class="t" font-size="15">arm64 이미지 → GHCR</text><text x="686" y="920" class="xs">빌드는 x86, 실행 층만 Arm · 커밋 SHA 태그</text>
    <rect class="box" x="1012" y="876" width="524" height="54"/>
    <text x="1032" y="900" class="t" font-size="15">SSH → deploy.sh</text><text x="1032" y="920" class="xs">배포 직전 DB 백업 → 새 SHA 기동 → 전부 healthy 대기 → 아니면 이전 SHA 로 자동 되돌림</text>
    <path class="ln" d="M264 903 H310" marker-end="url(#arr)"/>
    <path class="ln" d="M620 903 H666" marker-end="url(#arr)"/>
    <path class="ln" d="M966 903 H1012" marker-end="url(#arr)"/>
  </g>
  <path class="ln" d="M1274 876 V806 H700 V650" marker-end="url(#arr)"/>
  <text x="712" y="800" class="xs">새 이미지로 교체</text>
</svg>

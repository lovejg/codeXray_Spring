# 서버(오라클 Arm 한 대)의 /srv/codexray 에 놓이는 codeXray 묶음.
# 같은 서버에 다른 앱(Bandal)이 따로 살고, HTTPS 를 푸는 바깥 Nginx(/srv/edge)를 같이 쓴다.
#
# 길: 브라우저 → 바깥 Nginx(HTTPS, edge 네트워크) → frontend(정적파일, /api 는 backend 로) → backend → postgres/redis/kafka
# edge 네트워크에 붙는 건 frontend 하나뿐이다. 바깥 Nginx 는 backend 와 DB 의 이름조차 모른다.
# postgres, redis, kafka 는 이 묶음 전용이고 ports 가 없다(밖에서 닿지 않는다). Bandal 의 것과 섞이지 않는다.
#
# 서버에서는 배포 작업(GitHub Actions)이 이 파일과 스크립트, .env 를 올리고 ./deploy.sh <커밋 SHA> 로 띄운다.
# 비밀값은 같은 폴더의 .env 에서 읽는다(.env.example 참고, 커밋 금지)
name: codexray

services:
  # 입구. edge 와 이 묶음의 네트워크 둘 다에 붙는다
  frontend:
    image: ${IMAGE_PREFIX:-codexray}-frontend:${IMAGE_TAG:-local}
    build: ../frontend
    restart: unless-stopped
    mem_limit: 64m
    networks:
      default:
      edge:
        # 바깥 Nginx 는 이 이름으로 찾는다. 다른 앱의 입구(bandal-web)와 겹치지 않게
        aliases: [codexray-web]
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${IMAGE_PREFIX:-codexray}-backend:${IMAGE_TAG:-local}
    build: ../backend
    restart: unless-stopped
    # JVM 힙은 이 값의 75%(Dockerfile). 넘으면 이 컨테이너만 다시 뜬다
    mem_limit: 768m
    environment:
      # 같은 묶음 안의 컨테이너라 서비스 이름으로 찾는다
      DB_URL: jdbc:postgresql://postgres:5432/codexray
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 이 .env 에 없다}
      JWT_ACCESS_EXPIRATION_MS: "1800000"
      REFRESH_EXPIRATION_DAYS: "14"
      # HTTPS 로만 오므로 refresh 쿠키에 Secure 를 붙인다
      COOKIE_SECURE: "true"
      MAIL_MODE: smtp
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM 이 .env 에 없다}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      # 인증 메일 링크의 앞부분. 프론트와 같은 주소(same-origin)라 CORS 는 비운다
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL 이 .env 에 없다}
      APP_CORS_ORIGINS: ""
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY 가 .env 에 없다}
      # 비면 AI 요청만 FAILED(AI_UNAVAILABLE)로 끝나고 앱은 돈다
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_DAILY_LIMIT: "2"
      # 비면 소셜 로그인만 안 된다. 콜백은 프론트 화면 주소다(각 콘솔에 같은 주소를 등록)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${APP_BASE_URL}/oauth/callback/google
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      # 개발용 설정(application.yml)은 SQL 을 전부 로그에 찍는다. 운영에서는 끈다(로그 양, 값 노출)
      # 로거 이름 org.hibernate.SQL 은 대문자가 섞여 있다. 환경 변수(LOGGING_LEVEL_...)로 주면 소문자로 바뀌어 다른 로거가 되므로
      # 설정을 JSON 한 덩어리로 넘긴다
      SPRING_APPLICATION_JSON: '{"spring":{"jpa":{"show-sql":false}},"logging":{"level":{"org.hibernate.SQL":"warn"}}}'
    # ports 가 없다. frontend 만 이 컨테이너에 닿는다
    # JRE 이미지에 curl 이 없어서 bash 로 요청을 보낸다. 태그 목록은 로그인 없이 열리고 DB(또는 캐시)를 읽는다
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/tags HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    # 서버의 Bandal 과 같은 이미지라 한 번만 받는다
    image: postgres:17
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: codexray
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 .env 에 없다}
    volumes:
      # 컨테이너를 지우고 새로 만들어도 데이터는 이 볼륨에 남는다
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d codexray"]
      interval: 5s
      timeout: 3s
      retries: 10

  # refresh 토큰 저장소 + 조회 캐시. 이 네트워크 안에서만 닿아 비밀번호는 두지 않는다
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # refresh 토큰이 들어 있어서 메모리가 차도 키를 멋대로 지우는 설정(maxmemory 정책)은 켜지 않는다
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # AI 분석 비동기 처리용 Kafka (KRaft 단일 노드, Zookeeper 없음)
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    # 기본 힙 1GB 는 이 서버에 크다. 힙 512MB + 힙 밖 메모리
    mem_limit: 1g
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # backend 가 다시 붙을 주소. 같은 네트워크 안의 서비스 이름(kafka)이다
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

networks:
  # default 는 이 파일이 만드는 codexray 전용 네트워크(codexray_default)다
  edge:
    external: true

volumes:
  postgres-data:
  kafka-data:

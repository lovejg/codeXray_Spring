plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.codeXray'
version = '0.0.1-SNAPSHOT'

java {
	// toolchain 대신 실행 JDK(WSL의 JDK 21)를 그대로 사용.
	// toolchain 방식은 IDEA의 WSL 프로젝트 import를 깨뜨리는 알려진 버그가 있음(IDEA-367587).
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// DB driver (Postgres) — Node의 pg 대응
	runtimeOnly 'org.postgresql:postgresql'

	// Redis — refresh token 저장소 + 조회 캐시(@Cacheable) 백엔드
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Spring Cache 추상화(@EnableCaching/@Cacheable) 오토컨픽
	// Boot 4는 자동설정이 모듈로 쪼개져 있어 data-redis만으론 RedisCacheManager 자동설정이 안 붙음 → starter 필요
	implementation 'org.springframework.boot:spring-boot-starter-cache'

	// Kafka — AI 분석 비동기 처리(이벤트 발행/구독)
	// Boot 4는 auto-config가 모듈로 분리됨 → 라이브러리(spring-kafka)만으론 자동설정 안 붙어
	// starter 필요(@KafkaListener/KafkaAdmin/KafkaTemplate 자동설정 포함)
	implementation 'org.springframework.boot:spring-boot-starter-kafka'

	// Mail — 이메일 인증 발송 (Node의 nodemailer)
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Anthropic 공식 Java SDK — Claude 호출 (Node의 @anthropic-ai/sdk 대응)
	implementation 'com.anthropic:anthropic-java:2.34.0'

	// JWT (jjwt) — Node의 @nestjs/jwt 대응
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Flyway — DB 마이그레이션 + 시드 (Prisma migrate 대응)
	// Boot 4는 자동설정이 모듈로 쪼개져 flyway-core 만으론 auto-config가 안 붙음 → starter 필요
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// QueryDSL — 타입 안전 동적 쿼리 (OpenFeign 포크: 원조 정체로 유지보수 이관, Jakarta/Hibernate7 대응)
	implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.3.0'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.3.0:jpa'  // Q클래스 생성기
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

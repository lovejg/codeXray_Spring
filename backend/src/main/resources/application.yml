spring:
  application:
    name: backend

  # .env 파일을 설정값으로 로드 (Node의 dotenv 대응). 없어도 앱은 뜸(optional).
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway가 스키마를 소유. Hibernate는 엔티티↔스키마 일치 여부만 검증(validate).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false   # OSIV 끔 — 지연로딩을 서비스 계층 트랜잭션 안에서만 허용(권장)
    show-sql: true

  # Flyway: db/migration의 V1, V2... 를 순서대로 적용하고 flyway_schema_history에 기록.
  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  # SMTP 발송 설정. MAIL_MODE=smtp 일 때만 실제 사용됨(console 모드면 무시).
  # Gmail 기준 기본값: smtp.gmail.com:587 (STARTTLS). SMTP_USER/PASS 는 .env에서.
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 애플리케이션 커스텀 설정 (우리가 @ConfigurationProperties / @Value 로 읽음)
app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS}
    refresh-expiration-days: ${REFRESH_EXPIRATION_DAYS}
  cookie:
    secure: ${COOKIE_SECURE}
  mail:
    mode: ${MAIL_MODE}
    from: ${MAIL_FROM}
  base-url: ${APP_BASE_URL}
  admin:
    email: ${ADMIN_EMAIL}
    api-key: ${ADMIN_API_KEY}
  anthropic:
    # 없어도 앱은 뜸(빈 문자열). 실제 분석 호출 시 키 없으면 503.
    api-key: ${ANTHROPIC_API_KEY:}
  ai:
    daily-limit: ${AI_DAILY_LIMIT:2}   # 사용자당 1일 분석 횟수
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # 프론트 콜백 라우트(/oauth/callback/google)와 반드시 일치해야 함(구글 콘솔에도 동일하게 등록)
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/callback/google}
      # 아래 두 URL은 실제 구글 엔드포인트. 테스트 때 mock 서버로 덮어쓰려고 설정값으로 뺌
      token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
      userinfo-uri: ${GOOGLE_USERINFO_URI:https://www.googleapis.com/oauth2/v3/userinfo}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      # 네이버는 토큰 교환에 redirect_uri를 요구하지 않음(authorize/앱설정에만 사용) → 여기선 불필요
      token-uri: ${NAVER_TOKEN_URI:https://nid.naver.com/oauth2.0/token}
      userinfo-uri: ${NAVER_USERINFO_URI:https://openapi.naver.com/v1/nid/me}

logging:
  level:
    org.hibernate.SQL: debug

spring:
  application:
    name: backend

  # .env 파일을 설정값으로 로드 (Node의 dotenv 대응). 없어도 앱은 뜸(optional).
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 개발 단계: 엔티티 기준으로 테이블 자동 생성/수정. (Stage 4 시드 들어갈 때 Flyway로 전환 예정)
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false   # OSIV 끔 — 지연로딩을 서비스 계층 트랜잭션 안에서만 허용(권장)
    show-sql: true

  # Flyway는 아직 사용 안 함(스키마는 ddl-auto가 담당). 문제 시드 단계에서 켤 예정.
  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

# 애플리케이션 커스텀 설정 (우리가 @ConfigurationProperties / @Value 로 읽음)
app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS}
    refresh-expiration-days: ${REFRESH_EXPIRATION_DAYS}
  cookie:
    secure: ${COOKIE_SECURE}
  mail:
    mode: ${MAIL_MODE}
    from: ${MAIL_FROM}
  base-url: ${APP_BASE_URL}
  admin:
    email: ${ADMIN_EMAIL}
    api-key: ${ADMIN_API_KEY}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/google}
      # 아래 두 URL은 실제 구글 엔드포인트. 테스트 때 mock 서버로 덮어쓰려고 설정값으로 뺌
      token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
      userinfo-uri: ${GOOGLE_USERINFO_URI:https://www.googleapis.com/oauth2/v3/userinfo}

logging:
  level:
    org.hibernate.SQL: debug

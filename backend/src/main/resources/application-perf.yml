# 성능 측정 전용 프로필(perf/run-backend.sh 가 --spring.profiles.active=perf 로 켠다). 운영·개발에서는 쓰지 않는다.
#
# 측정 조건을 코드로 고정해 두는 곳이다. 예전 측정은 조건을 README 에 글로만 적어서
# (SQL 로깅을 켜고 재면 3배 느려지는 등) 다시 재는 사람이 같은 조건을 맞추기 어려웠다.
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # 실행된 SQL 수를 지표로 내보내려면 켜야 한다. 세 단계 모두 같은 조건으로 켜고 잰다(약간의 오버헤드가 똑같이 들어간다)
        generate_statistics: true
  kafka:
    # 측정에는 AI 기능을 쓰지 않는다. 브로커 없이 띄우므로 리스너를 시작하지 않는다(재연결 시도가 CPU 를 쓰지 않게)
    listener:
      auto-startup: false
    # 시작할 때 토픽을 만들러 브로커에 붙지 않는다(없는 브로커를 30초 기다려 기동이 늦어진다)
    admin:
      auto-create: false

logging:
  level:
    org.hibernate.SQL: off
    # generate_statistics 를 켜면 세션마다 통계 로그를 찍는다. 측정 중 로그 쓰기를 없앤다
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: off

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    # 모든 지표에 측정 단계 이름을 붙인다(1-before / 2-batch / 3-cache). Grafana 가 이 값으로 선을 나눠 같은 축에 그린다
    tags:
      state: ${PERF_STATE:unknown}
    distribution:
      # 서버 쪽 p95 를 Prometheus 가 계산할 수 있게 구간(bucket)도 내보낸다
      percentiles-histogram:
        http.server.requests: true

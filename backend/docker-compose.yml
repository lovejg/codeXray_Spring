services:
  db:
    image: postgres:16
    container_name: codexray-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0813"
      POSTGRES_DB: codexray
    ports:
      - "5432:5432"
    volumes:
      - codexray-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: codexray-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Kafka 브로커 (KRaft 모드 단일 노드 — Zookeeper 불필요). AI 분석 비동기 처리용.
  kafka:
    image: apache/kafka:3.9.0
    container_name: codexray-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 단일 노드라 복제 계수/ISR 전부 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: unless-stopped

volumes:
  codexray-db-data:
